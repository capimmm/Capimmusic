name: Build CapimMusic
on:
  push: { tags: ['v*'] }
  workflow_dispatch: {}
jobs:
  build:
    strategy:
      matrix: { os: [windows-latest, ubuntu-latest] }
    runs-on: ${{ matrix.os }}
    permissions: { contents: write }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20 }
      - run: npm install
      - run: node fetch-ytdlp.js
      - run: npx electron-builder ${{ matrix.os == 'windows-latest' && '--win' || '--linux' }} --publish ${{ startsWith(github.ref, 'refs/tags/') && 'always' || 'never' }}
        env: { GH_TOKEN: '${{ secrets.GITHUB_TOKEN }}' }
      - uses: actions/upload-artifact@v4
        with: { name: 'CapimMusic-${{ matrix.os }}', path: 'dist/CapimMusic-*' }
